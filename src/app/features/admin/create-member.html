<div class="cm-page">
    <div class="cm-card">
        <h1 class="cm-title">新規ログインメンバー承認</h1>
        <p class="cm-lead">
            新規ログインしたメンバーを選択して承認します。プロフィール情報（名前・メール・写真）はログイン元の情報を採用します。
        </p>

        @if (appService.pendingLoginMembers.length === 0) {
            <p class="cm-hint">承認待ちメンバーはいません。</p>
        } @else {
            <div class="cm-field">
                <label class="cm-label" for="pendingMembers">承認対象（複数選択）</label>
                <select id="pendingMembers" class="cm-select" multiple size="8">
                    @for (p of appService.pendingLoginMembers; track p.email) {
                        <option
                            [selected]="isChecked(p.email)"
                            (click)="onPendingChange(p.email, !isChecked(p.email))"
                        >
                            {{ p.name }} ({{ p.email }})
                        </option>
                    }
                </select>
            </div>
        }

        <div class="cm-field">
            <label class="cm-label" for="memberRole">承認後ロール</label>
            <select id="memberRole" class="cm-select" name="role" [(ngModel)]="role">
                @for (r of roleOptions; track r) {
                    <option [ngValue]="r">{{ r }}</option>
                }
            </select>
        </div>

        <div class="cm-actions">
            <button type="button" class="btn btn--primary" (click)="approveSelected()">選択メンバーを承認</button>
            <button type="button" class="btn btn--secondary" (click)="goTop()">トップへ戻る</button>
            <a routerLink="/admin/create-project" class="btn btn--ghost">プロジェクト作成・編集へ</a>
            @if (projectId) {
                <a [routerLink]="['/admin/manage-tasks', projectId]" class="btn btn--ghost">管理画面へ戻る</a>
            }
        </div>
    </div>
</div>
