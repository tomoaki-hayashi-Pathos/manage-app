<div class="cm-page">
    <div class="cm-card">
        <h1 class="cm-title">新規ログインメンバー承認</h1>
        <p class="cm-lead">
            新規ログインしたメンバーを選択して承認します。プロフィール情報（名前・メール・写真）はログイン元の情報を採用します。承認後はメンバーとして登録されます。
        </p>

        @if (appService.pendingLoginMembers.length === 0) {
            <p class="cm-hint">承認待ちメンバーはいません。</p>
        } @else {
            <div class="cm-field">
                <div class="cm-label" id="pendingMembersHeading">承認対象（複数選択）</div>
                <div class="cm-pending-list" role="group" aria-labelledby="pendingMembersHeading">
                    @for (p of appService.pendingLoginMembers; track p.email) {
                        <label class="member-check">
                            <input
                                type="checkbox"
                                [checked]="isChecked(p.email)"
                                (change)="onPendingChange(p.email, $any($event.target).checked)"
                            />
                            <span>{{ p.name }} ({{ p.email }})</span>
                        </label>
                    }
                </div>
            </div>
        }

        <div class="cm-actions">
            <button type="button" class="btn btn--primary" (click)="approveSelected()">選択メンバーを承認</button>
            <button type="button" class="btn btn--secondary" (click)="goOwnerMenu()">オーナー画面に戻る</button>
        </div>
    </div>
</div>
