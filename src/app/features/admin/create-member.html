<div class="cm-page">
    <div class="cm-card">
        <h1 class="cm-title">新規メンバー登録</h1>
        <p class="cm-lead">
            名前・メール・権限を入力します。写真は任意です（未設定時は名前の頭文字で赤いアイコンを自動生成します）。
        </p>

        <div class="cm-field">
            <label class="cm-label" for="memberName">名前</label>
            <input
                id="memberName"
                class="cm-input"
                type="text"
                name="name"
                [(ngModel)]="name"
                placeholder="山田 太郎"
                autocomplete="name"
            />
        </div>

        <div class="cm-field">
            <label class="cm-label" for="memberEmail">メールアドレス</label>
            <input
                id="memberEmail"
                class="cm-input"
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="taro@example.com"
                autocomplete="email"
            />
        </div>

        <div class="cm-field">
            <label class="cm-label" for="memberPhoto">写真（任意）</label>
            <input id="memberPhoto" class="cm-file" type="file" accept="image/*" (change)="onFileChange($event)" />
            <p class="cm-hint">アップロードしない場合、登録時に名前の頭文字から赤いアイコンを生成します。</p>
        </div>

        @if (avatarPreviewSrc) {
            <div class="cm-preview">
                <span class="cm-preview__label">プレビュー</span>
                <img class="cm-preview__img" [src]="avatarPreviewSrc" [alt]="name || 'アイコン'" />
            </div>
        }

        <div class="cm-field">
            <label class="cm-label" for="memberRole">権限</label>
            <select id="memberRole" class="cm-select" name="role" [(ngModel)]="role">
                @for (r of roleOptions; track r) {
                    <option [ngValue]="r">{{ r }}</option>
                }
            </select>
        </div>

        <div class="cm-actions">
            <button type="button" class="btn btn--primary" (click)="createMemberAndGoToProject()">登録してプロジェクト作成へ</button>
            <button type="button" class="btn btn--secondary" (click)="createMemberAndContinue()">続けて登録</button>
            <a routerLink="/admin/create-project" class="btn btn--ghost">プロジェクト作成へ戻る（登録しない）</a>
            <a [routerLink]="['/admin/manage-tasks', projectId]" class="btn btn--ghost">本プロジェクトへ戻る</a>
        </div>
    </div>
</div>
