<div class="entry">
  <div class="card">
    <h1>トップ</h1>
    @if (!app.ready() || auth.loading()) {
      <p>ログイン状態を確認しています。しばらくお待ちください。</p>
    } @else if (!auth.user()) {
      <p>まずGoogleでログインしてください。</p>
      <button type="button" class="btn" (click)="login()">Googleでログイン</button>
    } @else {
      <p>メニューへ移動しています…</p>
    }
  </div>
</div>
